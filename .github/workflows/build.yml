name: Build EYYOBUILD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Read mod version
        id: version
        run: |
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload build JARs
        uses: actions/upload-artifact@v4
        with:
          name: eyyobuild-mc26.2-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          JAR="build/libs/eyyobuild-${VERSION}.jar"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" "$JAR" \
            --target "${GITHUB_SHA}" \
            --title "EYYOBUILD $VERSION" \
            --prerelease \
            --generate-notes
