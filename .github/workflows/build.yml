name: Build EYYOBUILD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload build JARs
        uses: actions/upload-artifact@v4
        with:
          name: eyyobuild-mc26.2-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1-alpha.2 >/dev/null 2>&1 || gh release create v0.2.1-alpha.2 build/libs/eyyobuild-0.2.1-alpha.2.jar \
            --target "${GITHUB_SHA}" \
            --title "EYYOBUILD 0.2.1-alpha.2" \
            --prerelease \
            --generate-notes
